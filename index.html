<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Carbon Registry - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-bg float-animation">
    <div class="container">
        <div class="card glassmorphism">
            <h1>🌊 Blue Carbon Registry</h1>
            <p class="subtitle">Blockchain MRV System</p>
            <form onsubmit="validateFormAndRedirect(event, 'login')">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username" required>
                    <label for="username">Username</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>
                <button type="submit" class="cta-button">Login</button>
            </form>
            <p class="small-text">New here? <a href="signup.html">Register</a> or <a href="aboutus.html">Learn more about us</a></p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
