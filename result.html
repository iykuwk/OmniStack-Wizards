<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report</title>
  <link rel="stylesheet" href="result.css">
</head>
<body>
  <header class="header">
    <div class="logo">Image Analysis & Result</div>
    <div class="header-buttons">
      <button class="btn green">RESCAN PAGE</button>
      <button class="btn white">TRY ANOTHER PAGE</button>
    </div>
  </header>

  <main class="container">
    <!-- Title Section -->
    <section class="title-section">
      <h1>Report</h1>
    </section>
    <!-- Score Summary -->
    <section class="score-summary">
      <div class="score-box">
        <h3 class="big-score">100</h3>
        <p>Model Score</p>
        <span class="small-text">Out of 100</span>
      </div>
      <div class="score-box">
        <h3 class="big-score">10s</h3>
        <p>Model Prediction Time</p>
      </div>
    </section>

    <!-- Description & Report URL -->
    <section class="report-details">
      <p><strong>Report for:</strong> https://rootwebdesign.studio/</p>
    </section>

    <!-- Metrics Section -->
    <section class="metrics">
      <div class="metric">
        <span class="metric-title">Image Clearity</span>
        <div class="progress-bar">
          <div class="fill yellow" style="width: 100%;"></div>
        </div>
        <span class="metric-score">100</span>
      </div>
      <div class="metric">
        <span class="metric-title">Carbon Score</span>
        <div class="progress-bar">
          <div class="fill blue" style="width: 99%;"></div>
        </div>
        <span class="metric-score">99</span>
      </div>
    </section?>
  </main>
  <footer class="footer-note">
      <div class="logo">Copyrights Reserved @Omnistack_Wizards</div>
    </footer>
  <script src="script.js"></script>
</body>
</html>
