<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Carbon Registry - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-bg">
  <div class="container">
    <div class="card">
      <h1>🌊 Blue Carbon Registry</h1>
      <p class="subtitle">Blockchain MRV System</p>
      <p class="subtitle">Create a <b>Metamask Account</b> before Registering.</p>
      <form onsubmit="return loginUser(event)">
        <input type="text" id="FullName" placeholder="Enter Your FullName" required>
        <input type="text" id="Email" placeholder="Enter Your E-mail" required>
        <input type="password" id="password" placeholder="Enter Password" required>
        <input type="password" id="confirmpassword" placeholder="Enter Confirm Password" required>
         <button onclick="window.location.href='contentpage.html'">Register</button>
      </form>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
